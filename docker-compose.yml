# VPS-Betrieb: gsc-mcp hinter Caddy (automatisches HTTPS über Let's Encrypt).
# Voraussetzung: DNS-Eintrag MCP_DOMAIN zeigt auf den VPS, Ports 80 und 443 sind offen.
#   cp .env.example .env   # Werte eintragen
#   docker compose up -d --build
# Verwaltung (Mandanten, Tokens): docker compose run --rm -T gsc-admin --help
#
# Netze: Der Server hängt nur am internen Netz "internal" ohne Internetzugang. Ins Internet kommen nur
# Caddy (Zertifikate, eingehende Anfragen) und der Egress-Proxy, der allein die beiden Google-Ziele zulässt.

name: gsc-mcp

services:
  gsc-mcp:
    build: .
    image: gsc-mcp:local
    restart: unless-stopped
    depends_on: [egress]
    environment:
      MCP_ALLOWED_HOSTS: ${MCP_DOMAIN:?MCP_DOMAIN in .env setzen}
      # Nur Caddy erreicht den Container, daher darf X-Forwarded-For für das Rate-Limit gelten.
      MCP_TRUST_PROXY: "true"
      # Alle Anfragen an Google laufen über den Egress-Proxy; einen anderen Weg ins Internet gibt es nicht.
      GSC_EGRESS_PROXY: http://egress:3128
      GSC_AUDIT_RETENTION_DAYS: ${GSC_AUDIT_RETENTION_DAYS:-365}
      GSC_AUDIT_MAX_MB: ${GSC_AUDIT_MAX_MB:-100}
      GSC_MAX_INSPECTIONS_PER_DAY: ${GSC_MAX_INSPECTIONS_PER_DAY:-500}
      GSC_MAX_CALLS_PER_MINUTE: ${GSC_MAX_CALLS_PER_MINUTE:-60}
    # kein Port nach außen: nur Caddy spricht mit dem Container
    volumes:
      # Freigaben und Schlüssel schreibt nur gsc-admin; der Server sieht sie nur lesend
      - gsc_config:/config:ro
      - gsc_keys:/run/secrets/gsc:ro
      # Audit-Log (JSON Lines, eine Datei pro Monat) – in die Backups aufnehmen
      - audit_data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
    networks: [internal]

  egress:
    image: gsc-mcp:local
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["/nodejs/bin/node", "--permission", "--disallow-code-generation-from-strings", "--allow-fs-read=/app/"]
    command: ["/app/dist/egress.js"]
    environment:
      EGRESS_ALLOW: oauth2.googleapis.com:443,searchconsole.googleapis.com:443
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "/app/dist/healthcheck.js", "http://127.0.0.1:3128/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 50
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
    networks: [internal, outbound]

  caddy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    depends_on: [gsc-mcp]
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # beschreibbar sind nur die beiden Volumes (Zertifikate und Caddys eigene Konfiguration)
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
    networks: [internal, outbound]

  # Einmal-Container für die Verwaltung, ohne Netzwerk. Startet nicht mit "up", nur mit "run".
  gsc-admin:
    image: gsc-mcp:local
    pull_policy: never
    profiles: [admin]
    entrypoint:
      - /nodejs/bin/node
      - --permission
      - --disallow-code-generation-from-strings
      - --allow-fs-read=/app/
      - --allow-fs-read=/config/
      - --allow-fs-write=/config/
      - --allow-fs-read=/run/secrets/gsc/
      - --allow-fs-write=/run/secrets/gsc/
      - --allow-fs-read=/data/audit/
      - --allow-fs-write=/data/audit/
      - /app/dist/admin.js
    command: ["--help"]
    environment:
      GSC_AUDIT_RETENTION_DAYS: ${GSC_AUDIT_RETENTION_DAYS:-365}
    volumes:
      - gsc_config:/config
      - gsc_keys:/run/secrets/gsc
      - audit_data:/data
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 20
    mem_limit: 128m

networks:
  # Kein Internet, keine veröffentlichten Ports. inhibit_ipv4: die Bridge bekommt keine Adresse auf dem Host,
  # sonst wären Dienste des Hosts (z. B. eine Datenbank auf 0.0.0.0) über die Gateway-Adresse erreichbar.
  internal:
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
  outbound:

volumes:
  gsc_config:
  gsc_keys:
  audit_data:
  caddy_data:
  caddy_config:
